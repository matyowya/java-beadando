<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{menu :: menu}"></div>
<main class="container py-4 flex-grow-1">
    <h1>Admin</h1>
    <h2 class="h4 mt-4">Users</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead><tr><th>ID</th><th>Username</th><th>Role</th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.username}">name</td>
                <td th:text="${u.role}">USER</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{footer :: footer}"></th:block>
</body>
</html>
