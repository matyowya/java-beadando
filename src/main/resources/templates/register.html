<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{menu :: menu}"></div>
<main>
    <h1>Register</h1>
    <p th:if="${error}" th:text="${error}" class="error">invalid</p>
    <form th:action="@{/register}" method="post">
        <label>Username <input type="text" name="username" th:value="${username}" required autofocus></label>
        <label>Password <input type="password" name="password" required></label>
        <button type="submit">Register</button>
    </form>
    <a th:href="@{/login}">Login</a></p>
</main>
</body>
</html>
