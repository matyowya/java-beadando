<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kapcsolat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{menu :: menu}"></div>
<main class="container py-4 flex-grow-1">
    <div class="row">
        <div class="col-lg-7">
            <h1>Kapcsolat</h1>
            <p>Üzenj az oldal adminjának.</p>

            <div th:if="${param.elkuldve}" class="alert alert-success">Köszönjük, az üzenetedet elküldtük.</div>

            <form th:action="@{/kapcsolat}" th:object="${kapcsolatForm}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="nev">Név</label>
                    <input type="text" class="form-control" th:field="*{nev}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nev')}" th:errors="*{nev}">hiba</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">hiba</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="targy">Tárgy</label>
                    <input type="text" class="form-control" th:field="*{targy}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('targy')}" th:errors="*{targy}">hiba</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="szoveg">Üzenet</label>
                    <textarea class="form-control" th:field="*{szoveg}" th:errorclass="is-invalid" rows="6"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('szoveg')}" th:errors="*{szoveg}">hiba</div>
                </div>
                <button type="submit" class="btn btn-primary">Küldés</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{footer :: footer}"></th:block>
</body>
</html>
