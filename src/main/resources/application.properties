spring.application.name=java-beadando

# Adatbazis: egyelore beepitett H2 (memoriaban, ujrainditaskor kiurul).
# MySQL-re valtashoz ezt a harom sort cserej le a szerver adataira.
spring.datasource.url=jdbc:h2:mem:inein6;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# A data.sql (helyseg, szalloda, tavasz adatai) betoltese inditaskor,
# miutan a Hibernate letrehozta a tablakat.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
